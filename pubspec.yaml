publish_to: "none"
version: 0.1.0+1

environment:
   sdk: ^3.11.0

dependencies:
   flutter:
      sdk: flutter
   flutter_dotenv: ^6.0.0
   google_fonts: ^8.0.2
   shadcn_ui: ^0.52.1
   supabase_flutter: ^2.12.0

dev_dependencies:
